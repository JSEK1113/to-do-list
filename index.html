<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            background-color: #ced1f8; /* pastel blue */
            color: #333;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        h1 {
            color: #ffc1cc; /* soft purple title */
            font-size: 5em;
            margin-bottom: 20px;
            text-shadow: 
        -1px -1px 0 #ffffff,
         1px -1px 0 #ffffff,
        -1px  1px 0 #ffffff,
         1px  1px 0 #ffffff;
        }

        input[type="text"] {
            padding: 10px;
            width: 250px;
            border: 2px solid #ced1F8;
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
        }

        button {
            background-color: #ffc1cc; /* pastel pink */
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #ffd6e0;
        }

        ul {
            list-style: none;
            padding-left: 0;
            margin-top: 20px;
        }

        li {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        li span {
            flex-grow: 1;
        }

        .completed {
            text-decoration: line-through;
            color: #a1a1a1;
        }
    </style>
</head>
<body>

    <h1>To-Do List</h1>

    <input type="text" id="task-input" placeholder="Add a new task here">
    <button onclick="addTask()">Add</button>

    <ul id="todo-list"></ul>

    <script>
        let toDoList = JSON.parse(localStorage.getItem("tasks")) || [];

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(toDoList));
        }

        function addTask() {
            const input = document.getElementById("task-input");
            const taskText = input.value.trim();
            if (taskText !== "") {
                toDoList.push({ text: taskText, completed: false });
                input.value = "";
                saveTasks();
                updateList();
            }
        }

        function toggleComplete(index) {
            toDoList[index].completed = !toDoList[index].completed;
            saveTasks();
            updateList();
        }

        function removeTask(index) {
            toDoList.splice(index, 1);
            saveTasks();
            updateList();
        }

        function updateList() {
            const list = document.getElementById("todo-list");
            list.innerHTML = "";

            toDoList.forEach((task, index) => {
                const listItem = document.createElement("li");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.completed;
                checkbox.onclick = () => toggleComplete(index);

                const span = document.createElement("span");
                span.textContent = task.text;
                if (task.completed) {
                    span.className = "completed";
                }

                const removeBtn = document.createElement("button");
                removeBtn.textContent = "Remove";
                removeBtn.onclick = () => removeTask(index);

                listItem.appendChild(checkbox);
                listItem.appendChild(span);
                listItem.appendChild(removeBtn);
                list.appendChild(listItem);
            });
        }

        updateList();
    </script>

</body>
</html>
